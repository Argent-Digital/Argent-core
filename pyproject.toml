[project]
name = "Argent-core"
version = "1.1.0"
description = "Backend core service for Argent VPN"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "sqlalchemy>=2.0.49",
    "asyncpg>=0.31.0",
    "psycopg>=3.3.3",
    "psycopg-binary>=3.3.3",
    "alembic>=1.18.4",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",          
    "pytest-asyncio>=0.21.0", 
    "ruff>=0.1.0",       
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP"]
fixable = ["ALL"]
allowed-confusables = []

[tool.ruff.lint.bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "Depends"]

[tool.ruff.lint.isort]
known-first-party = ["src"]